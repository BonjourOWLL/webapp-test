<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 10px;
            margin: 5px 0;
            background: #f4f4f4;
        }
    </style>
</head>
<body>
    <h1>Ma liste de tâches</h1>
    <p id="counter">Tâches : 0</p>
    <input type="text" id="taskInput" placeholder="Nouvelle tâche...">
    <button onclick="addTask()">Ajouter</button>
    <ul id="taskList"></ul>

    <script>
      let taskCount = 0;

        function addTask() {
            const input = document.getElementById('taskInput');
            const task = input.value;
            if (task) {
                const li = document.createElement('li');
                li.textContent = task;
                li.style.cursor = 'pointer';
                li.onclick = function() {
                    if (confirm('Supprimer cette tâche ?')) {
                        li.remove();
                        taskCount--;
                        updateCounter();
                    }
                };
                document.getElementById('taskList').appendChild(li);
                input.value = '';
                taskCount++;
                updateCounter();
            }
        }

        function updateCounter() {
            document.getElementById('counter').textContent = 'Tâches : ' + taskCount;
        }
    </script>
</body>
</html>
